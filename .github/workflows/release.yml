name: Build portable bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Prepare version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.4.1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build bundled release
        run: |
          scripts/build-bundle.sh \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.value }}"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ytm-playlist-dl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
