name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Prepare version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.6.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install NSIS
        if: matrix.os == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - name: Build portable bundle
        run: |
          scripts/build-bundle.sh \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.value }}" \
            --desktop
      - name: Build Linux packages
        if: matrix.os == 'linux'
        run: |
          scripts/build-linux-packages.sh \
            --bundle "dist/ytm-playlist-dl-${{ matrix.os }}-${{ matrix.arch }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.value }}" \
            --out dist \
            --no-appimage
      - name: Build Windows installer
        if: matrix.os == 'windows'
        run: |
          scripts/build-windows-installer.sh \
            --bundle "dist/ytm-playlist-dl-${{ matrix.os }}-${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.value }}" \
            --out "dist/ytm-playlist-dl-${{ steps.version.outputs.value }}-${{ matrix.os }}-${{ matrix.arch }}-setup.exe"
      - name: Prepare update assets
        shell: bash
        run: |
          mkdir -p release-assets
          suffix=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then suffix=".exe"; fi
          cp "dist/ytm-playlist-dl-${{ matrix.os }}-${{ matrix.arch }}/ytm-playlist-dl-desktop${suffix}" \
             "release-assets/ytm-playlist-dl-desktop-${{ matrix.os }}-${{ matrix.arch }}${suffix}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release-assets/*
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Generate SBOM
        continue-on-error: true
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest \
            mod -json -output release/sbom.cdx.json
      - name: Create checksums
        run: |
          cd release
          if [[ -d release-assets ]]; then cp release-assets/* .; fi
          if [[ -d dist ]]; then cp dist/* .; fi
          rm -rf release-assets dist
          sha256sum ytm-playlist-dl-desktop-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
