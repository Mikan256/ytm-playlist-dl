[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm-playlist-dl"
version = "0.3.0"
description = "Download YouTube Music playlists with numbering, loudness normalisation and a local web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.0.0"]
authors = [{ name = "ytm-playlist-dl contributors" }]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ytm-playlist-dl = "main:main"
ytm-playlist-dl-web = "webui:main"

[tool.setuptools]
py-modules = [
  "config",
  "downloader",
  "main",
  "manifest",
  "models",
  "normalizer",
  "options",
  "report",
  "service",
  "webui",
]

[tool.setuptools.packages.find]
include = ["web*"]

[tool.setuptools.package-data]
web = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["options.py", "models.py", "manifest.py", "report.py"]
